name: All Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # the real suite, fully mocked so it doesnt break when a project gets unshared :')
      - name: Run pytest
        run: pytest -q

      - name: Test CLI command
        shell: bash
        run: |
          remixtree --help

      # this one actually hits the scratch api so it's allowed to flake (project gone etc)
      - name: Smoke test against a live project
        continue-on-error: true
        shell: bash
        run: |
          remixtree 91723110 --depth 1 --stats
